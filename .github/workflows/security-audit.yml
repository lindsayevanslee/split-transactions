name: Security Audit
run-name: "Security audit — scan npm dependencies for vulnerabilities"

on:
  schedule:
    # Run every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch:

# Every write (push, PR create/edit) uses the audit app's token below, so the
# default GITHUB_TOKEN only needs to read.
permissions:
  contents: read

jobs:
  audit-and-fix:
    runs-on: ubuntu-latest
    steps:
      # Mint a short-lived installation token from the audit GitHub App.
      # Opening and pushing the PR with this token (instead of the default
      # GITHUB_TOKEN) is what lets the CI workflow actually run on the resulting
      # PR: GitHub deliberately suppresses workflow runs for events triggered by
      # GITHUB_TOKEN, which otherwise leaves CI stuck at "action_required" and
      # blocks auto-merge.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # client-id replaces the deprecated app-id input. It is the app's
          # Client ID (Iv23...), not its numeric App ID.
          client-id: ${{ secrets.AUDIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUDIT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Persist the app token as the git credential so the later `git push`
          # is attributed to the app (not GITHUB_TOKEN) and therefore triggers CI.
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '24'
          cache: 'npm'

      # Installs use --ignore-scripts so no dependency's install script runs
      # while the app token is stored in git config. Nothing here builds or runs
      # the app; npm audit and npm audit signatures only read installed metadata.

      # --- Root project ---
      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Verify package provenance (root)
        id: root-signatures
        run: |
          set +e
          npm audit signatures > /tmp/root-signatures.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/root-signatures.txt

      - name: Run npm audit (root)
        run: npm audit --json > /tmp/root-audit.json 2>/dev/null || true

      - name: Add overrides for root vulnerabilities
        run: |
          node .github/scripts/add-audit-overrides.js /tmp/root-audit.json package.json > /tmp/root-summary.json

      - name: Regenerate root lockfile
        run: npm install --package-lock-only --ignore-scripts

      # --- Functions project ---
      - name: Install functions dependencies
        working-directory: functions
        run: npm ci --ignore-scripts

      - name: Verify package provenance (functions)
        id: functions-signatures
        working-directory: functions
        run: |
          set +e
          npm audit signatures > /tmp/functions-signatures.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/functions-signatures.txt

      - name: Run npm audit (functions)
        working-directory: functions
        run: npm audit --json > /tmp/functions-audit.json 2>/dev/null || true

      - name: Add overrides for functions vulnerabilities
        run: |
          node .github/scripts/add-audit-overrides.js /tmp/functions-audit.json functions/package.json > /tmp/functions-summary.json

      - name: Regenerate functions lockfile
        working-directory: functions
        run: npm install --package-lock-only --ignore-scripts

      # --- Check for invalid package signatures ---
      # npm audit signatures exits non-zero for invalid OR missing signatures,
      # and also when it could not check at all (e.g. the registry keys failed
      # to download). All three count as failures: matching "invalid" in the
      # output missed the last two and reported success.
      - name: Check for signature failures
        id: signatures
        env:
          ROOT_EXIT: ${{ steps.root-signatures.outputs.exit_code }}
          FUNCTIONS_EXIT: ${{ steps.functions-signatures.outputs.exit_code }}
        run: |
          if [ "$ROOT_EXIT" != "0" ] || [ "$FUNCTIONS_EXIT" != "0" ]; then
            echo "has_failures=true" >> "$GITHUB_OUTPUT"
            echo "WARNING: Package signature verification failed (root exit $ROOT_EXIT, functions exit $FUNCTIONS_EXIT)."
            cat /tmp/root-signatures.txt /tmp/functions-signatures.txt
          else
            echo "has_failures=false" >> "$GITHUB_OUTPUT"
            echo "All package signatures verified successfully."
          fi

      # --- Create PR if changes exist ---
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PR description
        if: steps.changes.outputs.has_changes == 'true'
        id: pr-body
        run: |
          {
            echo "body<<EOF"
            node --input-type=module -e "
              import { readFileSync } from 'fs';
              const root = JSON.parse(readFileSync('/tmp/root-summary.json', 'utf8'));
              const funcs = JSON.parse(readFileSync('/tmp/functions-summary.json', 'utf8'));

              const lines = ['## Automated Security Audit Fixes', '', 'This PR was automatically generated by the security audit workflow.'];

              function formatSection(label, summary) {
                if ((summary.bumped || []).length > 0) {
                  lines.push('', '### ' + label + ' \u2014 direct dependencies bumped');
                  summary.bumped.forEach(a => lines.push('- **' + a.name + '** \u2192 \`' + a.version + '\` in ' + a.section + ' (' + a.severity + ') \u2014 [advisory](' + a.url + ')'));
                }
                if (summary.added.length > 0) {
                  lines.push('', '### ' + label + ' \u2014 overrides added');
                  summary.added.forEach(a => lines.push('- **' + a.name + '** \u2192 \`' + a.version + '\` (' + a.severity + ') \u2014 [advisory](' + a.url + ')'));
                }
                if (summary.skipped.length > 0) {
                  lines.push('', '### ' + label + ' \u2014 no fix available');
                  summary.skipped.forEach(a => lines.push('- **' + a.name + '** (' + a.severity + '): ' + a.reason + ' \u2014 [advisory](' + a.url + ')'));
                }
              }

              formatSection('Root project', root);
              formatSection('Functions project', funcs);

              // Include signature verification results
              const rootSigs = readFileSync('/tmp/root-signatures.txt', 'utf8').trim();
              const funcsSigs = readFileSync('/tmp/functions-signatures.txt', 'utf8').trim();
              lines.push('', '### Package provenance verification');
              lines.push('**Root project:** ' + rootSigs.split('\n').pop());
              lines.push('**Functions project:** ' + funcsSigs.split('\n').pop());

              lines.push('', '---', 'Please review the overrides and lockfile changes before merging to ensure compatibility.');
              console.log(lines.join('\n'));
            "
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update PR
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_BODY: ${{ steps.pr-body.outputs.body }}
        run: |
          DATE=$(date +%Y-%m-%d)
          BRANCH="security/audit-fixes-$DATE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Check if a security audit PR already exists
          EXISTING_PR=$(gh pr list --search "head:security/audit-fixes" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING_PR" ]; then
            # Update existing PR branch
            BRANCH=$(gh pr view "$EXISTING_PR" --json headRefName --jq '.headRefName')
          fi

          # Fetch the remote branch if it exists, so force-with-lease has
          # a valid ref to compare against (prevents "stale info" rejections)
          git fetch origin "$BRANCH" 2>/dev/null || true

          git checkout -B "$BRANCH"
          git add package.json package-lock.json functions/package.json functions/package-lock.json
          git commit -m "Add security audit overrides ($DATE)" || true
          git push origin "$BRANCH" --force-with-lease

          if [ -n "$EXISTING_PR" ]; then
            # Keep the PR body in sync with the current overrides. Without this,
            # the body reflects only the overrides from the run that first opened
            # the PR, so later runs that add more overrides leave it stale.
            gh pr edit "$EXISTING_PR" --body "$PR_BODY"
            echo "Updated existing PR #$EXISTING_PR"
          else
            gh pr create \
              --title "Security: automated audit fixes ($DATE)" \
              --body "$PR_BODY"
            echo "Created new PR on branch $BRANCH"
          fi

      # Runs after the PR step so vulnerability fixes still get proposed, but
      # fails the run so GitHub sends a failure notification instead of the
      # result sitting unread in the log (or in no PR at all, if nothing changed).
      - name: Fail on signature verification failures
        if: steps.signatures.outputs.has_failures == 'true'
        run: |
          echo "::error::npm audit signatures failed. See the 'Verify package provenance' steps. Do not merge dependency changes until this is understood."
          exit 1
