name: CI
run-name: "CI — build, test, and lint"

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded runs on the same PR/branch so a rapid series of pushes
# does not queue up redundant jobs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, test, and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '24'
          cache: 'npm'

      # --- Root project ---
      - name: Install root dependencies
        run: npm ci

      - name: Lint (root)
        run: npm run lint

      - name: Build (root)
        run: npm run build

      - name: Test (root)
        run: npm run test:run

      # npm applies overrides silently, so an override that forces a version
      # outside what a dependent declares (e.g. body-parser 1.x into express 5)
      # shows as "overridden" in `npm ls` and passes `npm audit`. This check
      # reads both lockfiles and fails on any such override.
      #
      # --allow @grpc/grpc-js: @firebase/firestore (even the latest firebase)
      # asks for ~1.9.0, and every 1.9.x is vulnerable, so the override to
      # 1.13.6 stays. grpc-js is not in the browser bundle; it only loads when
      # firestore runs under Node. The check fails once this is no longer
      # needed, so the flag gets removed.
      - name: Check overrides fit dependents' ranges
        run: node .github/scripts/check-override-ranges.js --allow @grpc/grpc-js . functions

      # --- Functions project ---
      # Uses its own lockfile, so install and build it separately.
      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Build (functions)
        working-directory: functions
        run: npm run build

  lint-workflows:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Catches syntax errors, bad expressions, and shell issues in workflow
      # files, which otherwise only surface when a deploy is triggered.
      - name: Run actionlint
        run: |
          pip install actionlint-py==1.7.12.25
          actionlint
