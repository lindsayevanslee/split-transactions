name: CI
run-name: "CI — build, test, and lint"

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded runs on the same PR/branch so a rapid series of pushes
# does not queue up redundant jobs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, test, and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '20'
          cache: 'npm'

      # --- Root project ---
      - name: Install root dependencies
        run: npm ci

      - name: Lint (root)
        run: npm run lint

      - name: Build (root)
        run: npm run build

      - name: Test (root)
        run: npm run test:run

      # --- Functions project ---
      # Uses its own lockfile, so install and build it separately.
      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Build (functions)
        working-directory: functions
        run: npm run build
